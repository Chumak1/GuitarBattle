services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-GuitarBattle API}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      # Persistent sessions (see .env.example). Defaults are safe: a 30-day
      # rotating refresh token, Secure cookie only on HTTPS, 15s reuse grace.
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-auto}
      REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS:-15}
      SONG_FILES_DIR: /data/song_files
      CLIENT_ASSETS_DIR: /data/client_assets
      LANDING_MEDIA_DIR: /data/landing_media
      GAME_BUILDS_DIR: /data/game_builds
      APP_AUDIO_DIR: /data/app_audio
      GEOIP_DB_PATH: /data/geoip/dbip-country-lite.mmdb
      MAX_LANDING_MEDIA_BYTES: ${MAX_LANDING_MEDIA_BYTES:-52428800}
      MAX_GAME_BUILD_BYTES: ${MAX_GAME_BUILD_BYTES:-524288000}
      MAX_MIDI_UPLOAD_BYTES: 20971520
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@fretfight.online}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GuitarBattle}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_CODE_EXPIRE_MINUTES: ${EMAIL_CODE_EXPIRE_MINUTES:-15}
      EMAIL_CODE_RESEND_SECONDS: ${EMAIL_CODE_RESEND_SECONDS:-60}
      EMAIL_CODE_MAX_ATTEMPTS: ${EMAIL_CODE_MAX_ATTEMPTS:-5}
    volumes:
      - song_files_data:/data/song_files
      - client_assets_data:/data/client_assets
      - landing_media_data:/data/landing_media
      - game_builds_data:/data/game_builds
      - app_audio_data:/data/app_audio
      - geoip_data:/data/geoip
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  song_files_data:
  client_assets_data:
  landing_media_data:
  game_builds_data:
  app_audio_data:
  geoip_data:
