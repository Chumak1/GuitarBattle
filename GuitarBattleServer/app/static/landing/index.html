<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <meta name="description" content="fretfight — first guitar battle online.">
  <title>fretfight — first guitar battle online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b10'/%3E%3Cpath d='M24 16h25v9H34v7h13v9H34v17h-10z' fill='%23f3c451'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b10;
      --bg-soft: #0b1119;
      --surface: #101821;
      --text: #e9eff6;
      --muted: #8d9cab;
      --gold: #f3c451;
      --gold-strong: #ffb703;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(243, 196, 81, 0.10), transparent 36%),
        radial-gradient(circle at 82% 18%, rgba(109, 183, 255, 0.06), transparent 32%),
        linear-gradient(145deg, #0b1119 0%, var(--bg) 54%, #05080c 100%);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Faint fretboard grid, tying the page to the instrument. */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 118px, rgba(243, 196, 81, 0.18) 119px 120px),
        repeating-linear-gradient(0deg, transparent 0 176px, rgba(141, 156, 171, 0.12) 177px 178px);
      transform: perspective(900px) rotateX(62deg) translateY(12%);
      transform-origin: center;
      mask-image: radial-gradient(circle at 50% 48%, black, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at 50% 48%, black, transparent 70%);
    }

    /* Soft gold halo behind the silhouette. */
    body::after {
      content: "";
      position: absolute;
      width: min(110vmin, 1100px);
      aspect-ratio: 1;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(243, 196, 81, 0.12), transparent 66%);
      filter: blur(18px);
      pointer-events: none;
    }

    .guitar {
      position: absolute;
      left: 50%;
      top: 49%;
      width: min(54vh, 70vw);
      height: auto;
      transform: translate(-50%, -50%) rotate(-17deg);
      opacity: 0.70;
      filter: saturate(0.82) contrast(1.04);
      pointer-events: none;
      user-select: none;
    }

    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 8%, rgba(7, 11, 16, 0.28) 48%, rgba(7, 11, 16, 0.88) 100%),
        linear-gradient(180deg, rgba(7, 11, 16, 0.18), transparent 28%, transparent 72%, rgba(7, 11, 16, 0.42));
    }

    main {
      position: relative;
      z-index: 2;
      width: min(92vw, 1120px);
      padding: 24px;
      text-align: center;
      animation: reveal 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(2.8rem, 15vw, 13.5rem);
      font-weight: 900;
      letter-spacing: -0.065em;
      line-height: 0.82;
      text-transform: lowercase;
      text-shadow:
        0 0 1px rgba(255, 231, 166, 0.65),
        0 0 38px rgba(243, 196, 81, 0.24),
        0 18px 60px rgba(0, 0, 0, 0.62);
    }

    .tagline {
      margin: clamp(22px, 3vw, 34px) auto 0;
      max-width: 760px;
      color: var(--text);
      font-size: clamp(0.76rem, 1.4vw, 1.04rem);
      font-weight: 500;
      letter-spacing: 0.34em;
      line-height: 1.9;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
    }

    .tagline span {
      color: var(--gold);
    }

    .rule {
      width: clamp(54px, 8vw, 96px);
      height: 2px;
      margin: clamp(26px, 3.4vw, 40px) auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-strong), transparent);
      box-shadow: 0 0 20px rgba(255, 183, 3, 0.55);
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 3;
      color: rgba(141, 156, 171, 0.7);
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 620px) {
      .guitar {
        width: min(64vh, 76vw);
        opacity: 0.58;
      }

      .tagline {
        max-width: 88vw;
        letter-spacing: 0.22em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <svg class="guitar" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="bodyFill" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#203040"/>
        <stop offset="0.48" stop-color="#101821"/>
        <stop offset="1" stop-color="#05080c"/>
      </linearGradient>
      <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe7a6"/>
        <stop offset="0.46" stop-color="#f3c451"/>
        <stop offset="1" stop-color="#a97012"/>
      </linearGradient>
      <linearGradient id="fretboard" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0b1119"/>
        <stop offset="0.5" stop-color="#182432"/>
        <stop offset="1" stop-color="#0b1119"/>
      </linearGradient>
      <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#f3c451" stop-opacity="0.32"/>
        <stop offset="0.55" stop-color="#f3c451" stop-opacity="0.08"/>
        <stop offset="1" stop-color="#f3c451" stop-opacity="0"/>
      </radialGradient>
      <filter id="softBlur" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="neckGlow" x="-40%" y="-10%" width="180%" height="120%">
        <feGaussianBlur stdDeviation="3" result="glow"/>
        <feMerge>
          <feMergeNode in="glow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <ellipse cx="400" cy="760" rx="360" ry="430" fill="url(#halo)"/>

    <g filter="url(#softBlur)">
      <!-- Neck and fretboard -->
      <path d="M366 690 L382 188 L418 188 L434 690 Z" fill="url(#fretboard)" stroke="url(#goldFill)" stroke-width="5"/>
      <path d="M374 680 L388 202 L412 202 L426 680 Z" fill="#0a1017" opacity="0.9"/>

      <!-- Frets -->
      <g stroke="#8d9cab" stroke-opacity="0.30" stroke-width="2">
        <line x1="383" y1="238" x2="417" y2="238"/>
        <line x1="382" y1="280" x2="418" y2="280"/>
        <line x1="381" y1="322" x2="419" y2="322"/>
        <line x1="380" y1="364" x2="420" y2="364"/>
        <line x1="378" y1="406" x2="422" y2="406"/>
        <line x1="377" y1="448" x2="423" y2="448"/>
        <line x1="376" y1="490" x2="424" y2="490"/>
        <line x1="375" y1="532" x2="425" y2="532"/>
        <line x1="373" y1="574" x2="427" y2="574"/>
        <line x1="372" y1="616" x2="428" y2="616"/>
        <line x1="371" y1="658" x2="429" y2="658"/>
      </g>

      <!-- Strings -->
      <g stroke="#e9eff6" stroke-opacity="0.36" stroke-linecap="round">
        <line x1="375" y1="1005" x2="382" y2="198" stroke-width="1.4"/>
        <line x1="385" y1="1005" x2="389" y2="198" stroke-width="1.5"/>
        <line x1="395" y1="1005" x2="396" y2="198" stroke-width="1.7"/>
        <line x1="405" y1="1005" x2="403" y2="198" stroke-width="1.9"/>
        <line x1="415" y1="1005" x2="410" y2="198" stroke-width="2.1"/>
        <line x1="425" y1="1005" x2="417" y2="198" stroke-width="2.3"/>
      </g>

      <!-- Headstock -->
      <path d="M373 188 L353 94 C350 76 361 65 381 65 L419 65 C439 65 450 76 447 94 L427 188 Z"
            fill="url(#bodyFill)" stroke="url(#goldFill)" stroke-width="6"/>
      <line x1="374" y1="190" x2="426" y2="190" stroke="url(#goldFill)" stroke-width="7"/>

      <!-- Tuning pegs -->
      <g fill="url(#goldFill)">
        <rect x="327" y="84" width="28" height="11" rx="5.5"/>
        <rect x="327" y="116" width="28" height="11" rx="5.5"/>
        <rect x="327" y="148" width="28" height="11" rx="5.5"/>
        <rect x="445" y="84" width="28" height="11" rx="5.5"/>
        <rect x="445" y="116" width="28" height="11" rx="5.5"/>
        <rect x="445" y="148" width="28" height="11" rx="5.5"/>
        <circle cx="356" cy="89" r="5"/>
        <circle cx="356" cy="121" r="5"/>
        <circle cx="356" cy="153" r="5"/>
        <circle cx="444" cy="89" r="5"/>
        <circle cx="444" cy="121" r="5"/>
        <circle cx="444" cy="153" r="5"/>
      </g>

      <!-- Body -->
      <path d="M400 655
               C 360 655 326 675 311 715
               C 297 752 306 782 287 812
               C 261 854 236 876 236 941
               C 236 1021 306 1086 400 1086
               C 494 1086 564 1021 564 941
               C 564 876 539 854 513 812
               C 494 782 503 752 489 715
               C 474 675 440 655 400 655 Z"
            fill="url(#bodyFill)" stroke="url(#goldFill)" stroke-width="9"/>

      <!-- Inner body shading -->
      <path d="M400 695
               C 367 695 341 712 329 744
               C 317 776 326 807 309 835
               C 288 871 266 892 267 947
               C 268 1012 323 1057 400 1057
               C 477 1057 532 1012 533 947
               C 534 892 512 871 491 835
               C 474 807 483 776 471 744
               C 459 712 433 695 400 695 Z"
            fill="#081017" opacity="0.38"/>

      <!-- Pickguard -->
      <path d="M347 760
               C 327 804 337 866 368 906
               C 388 933 391 963 400 985
               C 421 982 449 954 464 914
               C 481 869 472 802 452 760 Z"
            fill="#060a0f" fill-opacity="0.78"
            stroke="#f3c451" stroke-opacity="0.24" stroke-width="3"/>

      <!-- Pickups -->
      <g>
        <rect x="345" y="831" width="110" height="29" rx="8" fill="#0a1017" stroke="url(#goldFill)" stroke-width="3"/>
        <rect x="345" y="905" width="110" height="29" rx="8" fill="#0a1017" stroke="url(#goldFill)" stroke-width="3"/>
        <g fill="#f3c451" opacity="0.72">
          <circle cx="363" cy="845" r="2.4"/><circle cx="380" cy="845" r="2.4"/>
          <circle cx="397" cy="845" r="2.4"/><circle cx="414" cy="845" r="2.4"/>
          <circle cx="431" cy="845" r="2.4"/><circle cx="448" cy="845" r="2.4"/>
          <circle cx="363" cy="919" r="2.4"/><circle cx="380" cy="919" r="2.4"/>
          <circle cx="397" cy="919" r="2.4"/><circle cx="414" cy="919" r="2.4"/>
          <circle cx="431" cy="919" r="2.4"/><circle cx="448" cy="919" r="2.4"/>
        </g>
      </g>

      <!-- Bridge -->
      <g>
        <rect x="352" y="974" width="96" height="24" rx="7" fill="url(#goldFill)" opacity="0.86"/>
        <rect x="362" y="981" width="12" height="10" rx="2" fill="#070b10" opacity="0.62"/>
        <rect x="380" y="981" width="12" height="10" rx="2" fill="#070b10" opacity="0.62"/>
        <rect x="398" y="981" width="12" height="10" rx="2" fill="#070b10" opacity="0.62"/>
        <rect x="416" y="981" width="12" height="10" rx="2" fill="#070b10" opacity="0.62"/>
      </g>

      <!-- Controls -->
      <g fill="#0b1119" stroke="url(#goldFill)" stroke-width="3">
        <circle cx="488" cy="986" r="15"/>
        <circle cx="488" cy="1024" r="15"/>
      </g>
      <circle cx="488" cy="986" r="4" fill="#f3c451"/>
      <circle cx="488" cy="1024" r="4" fill="#f3c451"/>

      <!-- Neck edge highlight -->
      <path d="M370 686 L385 204" stroke="#f3c451" stroke-opacity="0.28" stroke-width="2" fill="none"/>
      <path d="M430 686 L415 204" stroke="#070b10" stroke-opacity="0.55" stroke-width="2" fill="none"/>

      <!-- Body rim highlight -->
      <path d="M400 666
               C 366 666 336 684 323 720
               C 309 758 318 788 300 818
               C 278 855 251 880 250 941
               C 249 1005 307 1070 400 1070"
            fill="none" stroke="#ffe7a6" stroke-opacity="0.22" stroke-width="3" filter="url(#neckGlow)"/>
    </g>
  </svg>

  <div class="veil"></div>

  <main>
    <h1>fretfight</h1>
    <p class="tagline">First guitar battle <span>online</span></p>
    <div class="rule"></div>
  </main>

  <p class="footer">fretfight · coming soon</p>
</body>
</html>
