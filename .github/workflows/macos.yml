name: macOS build

# Builds the JUCE client for macOS on a GitHub-hosted runner, because the
# Windows development machine has no Xcode toolchain. The result is an
# unsigned .app: users must allow it in System Settings > Privacy & Security
# (or `xattr -dr com.apple.quarantine FretFight.app`) before the first launch.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/technical-pass
    paths:
      - "GuitarBattle/**"
      - ".github/workflows/macos.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The generated Xcode project references JUCE modules through the
      # Projucer global path (~/JUCE/modules), so JUCE must live there.
      - name: Fetch JUCE 9.0.2
        run: |
          git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"
          test -d "$HOME/JUCE/modules/juce_core"

      - name: Build Projucer
        run: |
          set -euo pipefail
          cd "$HOME/JUCE/extras/Projucer/Builds/MacOSX"
          xcodebuild -project Projucer.xcodeproj -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Regenerate the Xcode project
        run: |
          set -euo pipefail
          PROJUCER=$(find "$HOME/JUCE/extras/Projucer/Builds/MacOSX" -type f -name Projucer -perm -u+x | head -n 1)
          echo "Projucer: $PROJUCER"
          "$PROJUCER" --resave "$GITHUB_WORKSPACE/GuitarBattle/GuitarBattle.jucer"

      - name: Build the app
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/GuitarBattle/Builds/MacOSX"
          xcodebuild -project GuitarBattle.xcodeproj -target GuitarBattle \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: Package
        run: |
          set -euo pipefail
          APP=$(find "$GITHUB_WORKSPACE/GuitarBattle/Builds/MacOSX" -maxdepth 5 -type d -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/FretFight-macOS.zip"
          ls -lh "$GITHUB_WORKSPACE/FretFight-macOS.zip"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: FretFight-macOS
          path: FretFight-macOS.zip
          if-no-files-found: error
          retention-days: 30
