name: macOS build

# Builds the JUCE client for macOS on a GitHub-hosted runner, because the
# Windows development machine has no Xcode toolchain. The result is an
# ad-hoc signed .app: users must allow it in System Settings > Privacy &
# Security (or run `xattr -dr com.apple.quarantine FretFight.app`) before the
# first launch. Every disk image ships a helper that does this automatically.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/technical-pass
    paths:
      - "GuitarBattle/**"
      - ".github/workflows/macos.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The generated Xcode project references JUCE modules through the
      # Projucer global path (~/JUCE/modules), so JUCE must live there.
      - name: Fetch JUCE 9.0.2
        run: |
          git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"
          test -d "$HOME/JUCE/modules/juce_core"

      - name: Build Projucer
        run: |
          set -euo pipefail
          cd "$HOME/JUCE/extras/Projucer/Builds/MacOSX"
          # Ad-hoc signing ("-") keeps the JUCE "Sign Target" phase happy:
          # it reads CODE_SIGN_IDENTITY and fails on an unset variable.
          xcodebuild -project Projucer.xcodeproj -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            | tail -n 40

      - name: Regenerate the Xcode project
        run: |
          set -euo pipefail
          PROJUCER=$(find "$HOME/JUCE/extras/Projucer/Builds/MacOSX" -type f -name Projucer -perm -u+x | head -n 1)
          echo "Projucer: $PROJUCER"
          "$PROJUCER" --resave "$GITHUB_WORKSPACE/GuitarBattle/GuitarBattle.jucer"

      - name: Build the app (arm64 and x86_64)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/GuitarBattle/Builds/MacOSX"
          # The JUCE target is "<project> - App"; ad-hoc signing needs no
          # certificate and still produces a runnable bundle. Two separate
          # builds instead of one universal binary: the Intel and the Apple
          # Silicon packages are a third smaller each.
          for arch in arm64 x86_64; do
            echo "== building $arch"
            xcodebuild -project GuitarBattle.xcodeproj -target "GuitarBattle - App" \
              -configuration Release \
              ARCHS="$arch" ONLY_ACTIVE_ARCH=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build-$arch" \
              CODE_SIGN_IDENTITY="-" \
              | tail -n 40
            test -d "build-$arch/GuitarBattle.app"
          done

      - name: Package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/GuitarBattle/Builds/MacOSX"

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build-arm64/GuitarBattle.app/Contents/Info.plist)
          echo "Version: $VERSION"

          # macOS 15+ blocks an ad-hoc signed, not notarized app until the
          # quarantine attribute is removed. Both disk images ship the same
          # helper: a one-click .command and a short note. printf is used
          # instead of a heredoc so the YAML indentation never leaks into the
          # generated files (the shebang has to start in column 0).
          HELPERS="$RUNNER_TEMP/helpers"
          rm -rf "$HELPERS"
          mkdir -p "$HELPERS"

          printf '%s\n' \
            'FretFight для macOS' \
            '' \
            '1. Перетащите FretFight в папку Applications.' \
            '2. Приложение не нотаризовано Apple, поэтому при первом запуске macOS его' \
            '   блокирует. Дважды щёлкните «First launch.command» в этом окне — он снимет' \
            '   карантин и откроет FretFight.' \
            '   Либо выполните в Терминале:' \
            '       xattr -dr com.apple.quarantine /Applications/FretFight.app' \
            '   и запустите FretFight из папки Applications.' \
            '3. Если macOS пишет «Не удаётся открыть программу»: Системные настройки →' \
            '   Конфиденциальность и безопасность → прокрутите вниз → «Всё равно открыть».' \
            '' \
            'FretFight for macOS' \
            '' \
            '1. Drag FretFight into Applications.' \
            '2. The app is not notarized by Apple, so macOS blocks the first launch.' \
            '   Double-click "First launch.command" in this window: it removes the' \
            '   quarantine flag and opens FretFight.' \
            '   Alternatively, run in Terminal:' \
            '       xattr -dr com.apple.quarantine /Applications/FretFight.app' \
            '   and launch FretFight from Applications.' \
            '3. If macOS says "The application cannot be opened": System Settings →' \
            '   Privacy & Security → scroll down → "Open Anyway".' \
            > "$HELPERS/README.txt"

          printf '%s\n' \
            '#!/bin/bash' \
            '# FretFight is ad-hoc signed and not notarized, so macOS quarantines it.' \
            '# This helper removes the quarantine flag and opens the installed app.' \
            'APP="/Applications/FretFight.app"' \
            '' \
            'if [ ! -d "$APP" ]; then' \
            '  echo "Сначала перетащите FretFight в папку Applications."' \
            '  echo "Drag FretFight into Applications first."' \
            '  echo' \
            '  read -n 1 -s -r -p "Нажмите любую клавишу... / Press any key..."' \
            '  exit 1' \
            'fi' \
            '' \
            'xattr -dr com.apple.quarantine "$APP" 2>/dev/null' \
            'open "$APP"' \
            > "$HELPERS/First launch.command"
          chmod +x "$HELPERS/First launch.command"

          package_arch() {
            local arch="$1"
            local work="$RUNNER_TEMP/package-$arch"
            rm -rf "$work"
            mkdir -p "$work"
            cp -R "build-$arch/GuitarBattle.app" "$work/FretFight.app"

            local plist="$work/FretFight.app/Contents/Info.plist"

            # The bundle is renamed and re-branded after the build, so the
            # ad-hoc signature has to be renewed afterwards.
            /usr/libexec/PlistBuddy -c "Set :CFBundleName FretFight" "$plist"
            # The key already exists in the JUCE template, so Set comes first
            # and Add is only the fallback.
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FretFight" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string FretFight" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier online.fretfight.client" "$plist"
            codesign --force --deep --sign - "$work/FretFight.app"
            codesign --verify --deep --verbose=2 "$work/FretFight.app"

            cp "$HELPERS/README.txt" "$work/README.txt"
            cp "$HELPERS/First launch.command" "$work/First launch.command"

            # Drag-to-Applications disk image.
            ln -s /Applications "$work/Applications"
            hdiutil create -volname "FretFight" -srcfolder "$work" -ov -format UDZO \
              "$GITHUB_WORKSPACE/FretFight-$VERSION-$arch.dmg"
            rm -f "$work/Applications"

            ditto -c -k --sequesterRsrc --keepParent "$work/FretFight.app" \
              "$GITHUB_WORKSPACE/FretFight-$VERSION-$arch.zip"
          }

          package_arch arm64
          package_arch x86_64

          ls -lh "$GITHUB_WORKSPACE"/FretFight-*

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: FretFight-macOS
          path: |
            FretFight-*.dmg
            FretFight-*.zip
          if-no-files-found: error
          retention-days: 30
